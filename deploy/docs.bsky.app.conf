# nginx config for docs.bsky.app after this site ships on bsky.network.
#
# DRAFT — not deployed by anything in this repo. This is the companion piece to
# the `redirects` block in docusaurus.config.js: that block handles per-page
# moves *on bsky.network*, this handles the hostname move and the one prefix
# that has no home on bsky.network at all.
#
# The two layers only compose if this wildcard PRESERVES THE PATH. A bare
# `return 301 https://bsky.network/;` would strand every legacy deep link on the
# homepage and no client-side redirect on the new site could ever fire.

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name docs.bsky.app;

  # ssl_certificate / ssl_certificate_key ...

  # The generated HTTP/XRPC reference (223 legacy URLs) is not part of the new
  # site — it lives on the standalone OpenAPI site. Must come before the
  # wildcard: bsky.network has nothing at /docs/api/*.
  location /docs/api/ {
    return 301 https://endpoints.bsky.app/;
  }

  location = /docs/api/at-protocol-xrpc-api {
    return 301 https://endpoints.bsky.app/;
  }

  # Everything else: same path, new host. Deep links then hit the new site's
  # client-side redirect for their specific page, where one exists.
  location / {
    return 301 https://bsky.network$request_uri;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name docs.bsky.app;
  return 301 https://docs.bsky.app$request_uri;
}
