# Serves the built Docusaurus site inside the bps-website-ui image.
# (Sibling file docs.bsky.app.conf is unrelated: a draft host-level redirect.)

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Terminates at the load balancer, which knows the public hostname; nginx
  # does not. Without this, the slash-appending redirect for a directory
  # request leaks the container's own host:port into the Location header.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json image/svg+xml application/manifest+json;

  # Container liveness/readiness. The site has no page at this path.
  location = /_health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Docusaurus fingerprints everything under /assets/, so these are immutable.
  # One explicit header rather than `expires 1y` plus an override, which emits
  # two Cache-Control headers for caches to reconcile.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # HTML must not be cached at the edge: a stale document would reference
  # asset hashes that no longer exist after a deploy.
  location / {
    # $uri/ resolves pretty URLs (/docs/foo -> /docs/foo/index.html);
    # $uri.html covers any page emitted as a flat file.
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
