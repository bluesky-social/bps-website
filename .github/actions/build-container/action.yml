name: Build container
description: Build a bps-website image and optionally publish it to GHCR.

inputs:
  service:
    description: GHCR package name.
    required: true
  file:
    description: Dockerfile path relative to the repository root.
    required: true
  build-args:
    description: Newline-separated Docker build arguments.
    required: false
    default: ""
  bps-public-api-origin:
    description: Public API origin baked into the UI image.
    required: false
    default: ""
  push:
    description: Whether to publish the image.
    required: true

runs:
  using: composite
  steps:
    - name: Check UI build variables
      if: inputs.service == 'bps-website-ui'
      shell: bash
      env:
        BPS_PUBLIC_API_ORIGIN: ${{ inputs.bps-public-api-origin }}
      run: |
        set -euo pipefail
        if [ -z "$BPS_PUBLIC_API_ORIGIN" ]; then
          echo "::error::Repository variable BPS_PUBLIC_API_ORIGIN is not set." \
               "Set it under Settings > Secrets and variables > Actions > Variables" \
               "to the public origin of bps-website-api (e.g. https://api.bsky.network)."
          exit 1
        fi
        echo "BPS_PUBLIC_API_ORIGIN is set."

    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: Generate image metadata
      id: metadata
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ inputs.service }}
        tags: type=sha,prefix=,format=long

    - name: Build and optionally publish
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        file: ${{ inputs.file }}
        build-args: ${{ inputs.build-args }}
        push: ${{ inputs.push }}
        tags: ${{ steps.metadata.outputs.tags }}
        labels: ${{ steps.metadata.outputs.labels }}
        cache-from: type=gha,scope=${{ inputs.service }}
        cache-to: type=gha,mode=max,scope=${{ inputs.service }}
